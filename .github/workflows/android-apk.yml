name: Build ENN Store Manager APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (Expo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: _build_source/ENN-StoreManager-Full/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Expo project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          archives = list(root.glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one project ZIP in repository root; found {len(archives)}")
          dest = root / "_build_source"
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archives[0]) as z:
              z.extractall(dest)
          candidates = list(dest.rglob("package.json"))
          candidates = [p for p in candidates if "node_modules" not in p.parts]
          if len(candidates) != 1:
              raise SystemExit(f"Expected one package.json in project ZIP; found {len(candidates)}")
          project = candidates[0].parent
          if not (project / "app.json").exists():
              raise SystemExit("Expo app.json not found beside package.json")
          import json
          pkg = json.loads((project / "package.json").read_text())
          if "expo" not in pkg.get("dependencies", {}):
              raise SystemExit("This project is not configured as an Expo app")
          print(f"Expo project located at: {project}")
          (root / "project-dir.txt").write_text(str(project.resolve()))
          PY
          echo "PROJECT_DIR=$(cat project-dir.txt)" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: ${{ github.workspace }}/_build_source/ENN-StoreManager-Full
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        working-directory: ${{ github.workspace }}/_build_source/ENN-StoreManager-Full
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/_build_source/ENN-StoreManager-Full/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ENN-StoreManager-debug-apk
          path: _build_source/ENN-StoreManager-Full/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
