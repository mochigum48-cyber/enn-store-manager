
name: Build ENN Store Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q ENN-StoreManager_GitHubBuild.zip
          cd ENN-StoreManager
          test -f package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install and build
        working-directory: ENN-StoreManager
        run: |
          npm install
          npm run build

      - name: Create Android project
        working-directory: ENN-StoreManager
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: ENN-StoreManager/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ENN-StoreManager-debug-apk
          path: ENN-StoreManager/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
